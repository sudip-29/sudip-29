<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 1200 620"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title desc">
  <title id="title">Sudip Pal Tech Stack — 29</title>
  <desc id="desc">Technology icons arranged in the shape of the number 29.</desc>

  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- subtle guide strokes that make the 29 shape clear -->
  <g fill="none" stroke="currentColor" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round" opacity=".10">
    <!-- 2 -->
    <path d="M150 105 H585 M535 120 L315 350 M165 500 H585"/>
    <!-- 9 -->
    <path d="M735 105 H1045 V250 H755 V365 H1045 V505 H755"/>
  </g>

  <!-- Technology icons -->
  <g filter="url(#softShadow)">
    <!-- 2 -->
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/c/c-original.svg"
           x="125" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>C</title>
    </image>

    <image href="https://skillicons.dev/icons?i=py"
           x="265" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Python</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg"
           x="405" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Java</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
           x="545" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>JavaScript</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
           x="405" y="195" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>HTML5</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
           x="265" y="320" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>CSS3</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg"
           x="125" y="465" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Figma</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/pycharm/pycharm-original.svg"
           x="265" y="465" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>PyCharm</title>
    </image>

    <!-- 9 -->
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/intellij/intellij-original.svg"
           x="715" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>IntelliJ IDEA</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/kotlin/kotlin-original.svg"
           x="855" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Kotlin</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/android/android-original.svg"
           x="995" y="70" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Android</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg"
           x="995" y="215" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>MongoDB</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/spring/spring-original.svg"
           x="855" y="215" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Spring</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/fastapi/fastapi-original.svg"
           x="715" y="215" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>FastAPI</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"
           x="715" y="340" width="70" height="70" preserveAspectRatio="xMidYMid meet">
      <title>Node.js</title>
    </image>

    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg"
